<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede6;
  --ink: #1d1d1b;
  --ink-2: #4a4a45;
  --ink-3: #6d6c66;
  --line: #dcd9cf;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #e3eef6;
  --done: #2f7a46;   --done-soft: #e2f1e6;
  --doing: #1f5f8b;  --doing-soft: #e3eef6;
  --todo: #6d6c66;   --todo-soft: #ecebe6;
  --blocked: #a33a2a; --blocked-soft: #f7e3df;
  --p0: #a33a2a; --p1: #8a5a00; --p2: #6d6c66;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #1f1f1c; --surface-2: #2a2a26; --ink: #ecebe5; --ink-2: #c4c3bb; --ink-3: #9a998f;
    --line: #3a3a35; --accent: #7fb6dd; --accent-ink: #10202b; --accent-soft: #1d2f3c;
    --done: #7cc792; --done-soft: #1d3324; --doing: #7fb6dd; --doing-soft: #1d2f3c; --todo: #a9a89f; --todo-soft: #2a2a26;
    --blocked: #ec8f7f; --blocked-soft: #3d221d; --p0: #ec8f7f; --p1: #e0b25a; --p2: #a9a89f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #1f1f1c; --surface-2: #2a2a26; --ink: #ecebe5; --ink-2: #c4c3bb; --ink-3: #9a998f;
  --line: #3a3a35; --accent: #7fb6dd; --accent-ink: #10202b; --accent-soft: #1d2f3c;
  --done: #7cc792; --done-soft: #1d3324; --doing: #7fb6dd; --doing-soft: #1d2f3c; --todo: #a9a89f; --todo-soft: #2a2a26;
  --blocked: #ec8f7f; --blocked-soft: #3d221d; --p0: #ec8f7f; --p1: #e0b25a; --p2: #a9a89f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.eyebrow { font-size: 13px; color: var(--ink-3); letter-spacing: .02em; margin: 0 0 6px; }
h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.3; margin: 0 0 8px; font-weight: 700; }
.lede { font-size: 17px; color: var(--ink-2); margin: 0 0 4px; max-width: 760px; }
.updated { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }

nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 16px; }
.tabrow { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding: 8px 0; }
.tab {
  flex: 0 0 auto; appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 15px; font-weight: 500; padding: 8px 14px; border-radius: 999px; cursor: pointer; min-height: 40px;
}
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab:focus-visible, .chip:focus-visible, .copy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

main { padding: 20px 0 64px; }
section.panel { display: none; }
section.panel.on { display: block; }
h2 { font-size: 22px; margin: 0 0 12px; line-height: 1.35; }
h3 { font-size: 18px; margin: 24px 0 10px; line-height: 1.4; }
.sub { color: var(--ink-3); font-size: 14px; margin: -6px 0 16px; }
p { margin: 0 0 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stack > * + * { margin-top: 10px; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .n { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 14px; color: var(--ink-3); margin-top: 2px; }

.status { display: flex; gap: 12px; align-items: flex-start; }
.status .lab { font-weight: 700; }
.status .val { color: var(--ink-2); font-size: 15px; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.s-done { color: var(--done); background: var(--done-soft); }
.s-doing { color: var(--doing); background: var(--doing-soft); }
.s-todo { color: var(--todo); background: var(--todo-soft); }
.s-blocked { color: var(--blocked); background: var(--blocked-soft); }
.pri { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; }
.P0 { color: var(--p0); } .P1 { color: var(--p1); } .P2 { color: var(--p2); }
.who { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin: 2px 4px 2px 0; white-space: nowrap; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl { position: relative; padding: 0 0 18px 30px; }
.tl::before { content: ""; position: absolute; left: 0; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--todo); }
.tl.done::before { border-color: var(--done); background: var(--done); }
.tl.doing::before { border-color: var(--doing); }
.tl.blocked::before { border-color: var(--blocked); }
.tl .when { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tl .what { font-weight: 700; font-size: 17px; margin: 2px 0; }
.tl .det { color: var(--ink-2); font-size: 15px; margin: 2px 0 4px; }
.todayline { position: relative; padding: 0 0 18px 30px; color: var(--accent); font-weight: 700; font-size: 14px; }
.todayline::before { content: ""; position: absolute; left: -2px; top: 9px; width: 20px; height: 3px; background: var(--accent); border-radius: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.chip { appearance: none; font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.task { display: grid; gap: 4px; }
.task .row1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.task .t { font-weight: 700; font-size: 16px; flex: 1 1 220px; }
.task .d { color: var(--ink-2); font-size: 15px; }
.task .meta { font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.count { font-size: 14px; color: var(--ink-3); margin: 0 0 10px; }

dl.kv { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 10px 16px; margin: 0; }
dl.kv dt { font-weight: 700; color: var(--ink-2); }
dl.kv dd { margin: 0; }
@media (max-width: 560px) { dl.kv { grid-template-columns: 1fr; gap: 2px; } dl.kv dd { margin-bottom: 10px; } }
ul.plain { margin: 4px 0 0; padding-left: 20px; }
ul.plain li { margin: 3px 0; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); font-weight: 700; color: var(--ink-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }

.note { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 15px; color: var(--ink); }
.path { font-family: Consolas, "D2Coding", monospace; font-size: 13px; color: var(--ink-2); word-break: break-all; }
.copy { appearance: none; font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; margin-left: 6px; min-height: 28px; }
.link-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.link-row .lab { font-weight: 700; min-width: 120px; }
.dec .q { font-weight: 700; font-size: 16px; }
.dec .rec { margin-top: 6px; font-size: 15px; }
.dec .rec b { color: var(--accent); }
.muted { color: var(--ink-3); }
.notebtn { appearance: none; font: inherit; font-size: 15px; font-weight: 700; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; min-height: 40px; margin-top: 12px; }
.notebtn:focus-visible, .noteform button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.noteform { display: grid; gap: 12px; }
.noteform label { display: grid; gap: 4px; font-weight: 700; font-size: 15px; }
.noteform input, .noteform select, .noteform textarea { font: inherit; font-size: 16px; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.noteform textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.noteform .row2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 560px) { .noteform .row2 { grid-template-columns: 1fr; } }
.noteform button { appearance: none; font: inherit; font-weight: 700; font-size: 16px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 12px 18px; cursor: pointer; justify-self: start; min-height: 44px; }
.noteform button[disabled] { opacity: .6; cursor: default; }
.formmsg { font-size: 15px; min-height: 1.6em; }
.formmsg.ok { color: var(--done); } .formmsg.bad { color: var(--blocked); }
.note .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; color: var(--ink-3); }
.note .head b { color: var(--ink); font-size: 16px; }
.note .body { white-space: pre-wrap; margin-top: 6px; font-size: 16px; }
.note .reply { margin-top: 8px; font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--done); padding-left: 10px; }
footer { border-top: 1px solid var(--line); padding: 16px 0 40px; font-size: 13px; color: var(--ink-3); }
.err { padding: 24px; }
</style>
</head>

oing","source":"07 D07"},{"id":"D08","title":"주 결과 도구 확정","detail":"TAS 허락을 받으면 TAS-K, 최종 제출 때까지 없으면 연구진 5문항 총점. GSE·EDLQ 원문과 사용 조건도 확인합니다.","owner":"김선휘","people":["김선휘"],"due":"IRB 최종 제출 전","priority":"P0","state":"todo","source":"07 D08"},{"id":"D09","title":"나이 기준·추적 시점·대상","detail":"만 60세/65세, 기기 대여 범위, 제외 기준, 추적 42일(추천) 또는 28일을 정합니다.","owner":"공동","people":["김선휘","이연실","송미령","복지관"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"07 D09"},{"id":"D10","title":"실제 역할과 연락처","detail":"대표·대체 동의담당자, 공식 소속·직위·연락처, 교육 이수증, 두 교수의 수업 관계, 연락 가능 시간을 확인합니다.","owner":"공동","people":["이연실","송미령","김선휘"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"07 D10"},{"id":"D11","title":"복지관 협조서·RISE 자료 조항","detail":"복지관 모집 허락·이용자 수·방문 일정 서면 답, RISE 제11조(자료 소유·논문 사용) 서면 답을 받습니다.","owner":"공동","people":["이연실","송미령","복지관","RISE"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"07 D11"},{"id":"D12","title":"학교 IRB 최신 절차 확인","detail":"현재 양식, 심의 일정·종류, 교육 기간, 보고 기한, 손상 보상 규정, 종료일 기준을 확인합니다.","owner":"IRB 사무국","people":["김선휘","IRB 사무국"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"07 D12"},{"id":"D13","title":"확인 연습 과제 고정","detail":"버거 세 사람 점심·주차 할인 미션 A 중 1~2개와 순서, 문구, 기기 조건을 고정합니다. 같은 과제 반복의 외운 효과는 한계로 적습니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D13"},{"id":"D14","title":"도움·음성·쉼 조건 맞추기","detail":"0일과 14일에 같은 도움 방식. 지금은 15분 동안 조작이 없으면 기록이 닫혀 긴 휴식 보존 기능이 필요합니다. 시작 전 필수.","owner":"김선휘","people":["김선휘"],"due":"첫 0일 전","priority":"P1","state":"doing","source":"07 D14"},{"id":"D15","title":"응답 기한·늦은 응답 처리","detail":"7일 설문 7~9일, 14일 설문 14~16일, 추적 ±7일 제안. 늦은 답을 어떻게 셀지 정합니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D15"},{"id":"D16","title":"장소별 연습량","detail":"장소별 최소량·권장 상한·추가 연습과 15일 이후 무보상 사용을 어떻게 다룰지 정합니다. 실제 연습량은 따로 기록합니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D16"},{"id":"D17","title":"분석 계획 확정","detail":"분석 모형, 빠진 자료 처리, 실제 사용 기회 문항 분석을 정합니다. 분석을 따로 다시 해 볼 사람(독립 재현 담당)도 정합니다.","owner":"김선휘","people":["김선휘","이연실","송미령"],"due":"자료 수집 전","priority":"P1","state":"todo","source":"07 D17"},{"id":"D18","title":"안전 연락 운영","detail":"불편 신고를 다음 평일 18시까지 확인하는 안. 문의 받는 시간, 대체 담당, 야간·주말 안내, 긴급 시 119 안내를 정합니다.","owner":"공동","people":["이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D18"},{"id":"D19","title":"방문·설문·교통비 사례","detail":"0일·14일 방문, 추적 설문, 교통비를 따로 드릴지와 지급 시점을 정합니다. 하루 사례비와 분리합니다.","owner":"공동","people":["김선휘","이연실","송미령","RISE"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D19"},{"id":"D20","title":"예비 점검 계획","detail":"인지면담 약 5명·파일럿 3~5명의 별도 동의·사례, 본 참여자와 겹침 여부를 정합니다. 녹음은 하지 않습니다.","owner":"공동","people":["이연실","송미령","김선휘"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"07 D20"},{"id":"D21","title":"연구용 앱 검증과 판 고정","detail":"번호·기록 분리·내려받기는 완료. 설문 연결 검산, 실제 기기 점검, 판 고정 날짜가 남았습니다.","owner":"김선휘","people":["김선휘"],"due":"첫 0일 전","priority":"P1","state":"doing","source":"07 D21"},{"id":"T01","title":"TAS 허락 요청 메일 보내기","detail":"초안은 08 파일. 학교 메일로 교신 저자에게 보냅니다. 2주 안에 답이 없으면 다시 보냅니다.","owner":"김선휘","people":["김선휘"],"due":"2026-10 첫째~둘째 주 (권고)","priority":"P0","state":"todo","source":"08"},{"id":"T02","title":"TAS 영어 원문 확보","detail":"Meuter 등(2003) 원문을 학교 도서관으로 받아 문항 순서·응답 형식을 확인합니다.","owner":"김선휘","people":["김선휘"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"03 §11"},{"id":"T03","title":"GSE·EDLQ 원문과 사용 조건 확보","detail":"GSE 한국어판 파일과 EDLQ 문항·채점법을 받고 사용 허락이 필요한지 확인합니다.","owner":"김선휘","people":["김선휘"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"03 §11"},{"id":"T04","title":"연구진 5문항 전문가 검토","detail":"노인·디지털 교육·측정 전문가 5~6명(공동연구원 제외)이 문항 관련성을 평가합니다. 전문가 명단이 미정입니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"03 §3.3"},{"id":"T05","title":"최신 IRB 양식으로 옮기기","detail":"기존 HWP는 10/2 판이라 바뀐 설계가 빠져 있습니다. 미정 칸을 채운 뒤 새 양식으로 옮기고 모든 쪽을 눈으로 확인합니다.","owner":"김선휘","people":["김선휘"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"05 체크리스트"},{"id":"T06","title":"서약서·교육 이수증 확인","detail":"세 사람(조원이 있으면 조원도)의 생명윤리 서약서와 이수증 유효기간을 확인합니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P0","state":"todo","source":"05 체크리스트"},{"id":"T07","title":"이해상충 서식 작성","detail":"연구책임자가 앱 개발자이자 복지관 수업 강사라는 점을 공개합니다.","owner":"김선휘","people":["김선휘"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"05 체크리스트"},{"id":"T08","title":"예비 점검용 설명서·동의서 만들기","detail":"인지면담·파일럿용 서류가 아직 없습니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"05 체크리스트"},{"id":"T09","title":"설문 실시 방법 정하기","detail":"앱 안 설문 화면이 없어 종이·전화·전자 중 무엇으로 받을지 정하고, 같은 번호로 손으로 연결·검산하는 절차를 만듭니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"03 §2.4, 06"},{"id":"T10","title":"모집 방법·숙려 시간·대여 기기 수","detail":"선착순/추첨, 설명서를 미리 드린 뒤 최소 생각할 시간, 큰 화면 기기 대여 대수와 기준을 정합니다.","owner":"공동","people":["이연실","송미령","김선휘"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"04 1.3, 05 설명서"},{"id":"T11","title":"연구 제목 확정","detail":"대조군이 없으므로 효과를 단정하는 제목은 쓰지 않습니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"04 1.1.1"},{"id":"T12","title":"참여자 권리 문의 창구 확인","detail":"IRB 행정전화 031-369-9213을 참여자 권리 문의에 써도 되는지 확인합니다.","owner":"IRB 사무국","people":["김선휘","IRB 사무국"],"due":"동의서 확정 전","priority":"P1","state":"todo","source":"05 설명서 13번"},{"id":"T13","title":"참여자 사례비 외 예산 산정","detail":"인쇄·문자·기기 대여·서버·심의비를 산정합니다.","owner":"김선휘","people":["김선휘","RISE"],"due":"IRB 신청 전","priority":"P1","state":"todo","source":"04 2.1.1"},{"id":"T14","title":"다음 해 수강생 선정에서 연구책임자 제외","detail":"참여·거절이 다음 교육 선정에 영향을 주지 않도록 2027년 선정에서 김선휘를 빼는 조치를 확인합니다.","owner":"공동","people":["이연실","송미령","복지관"],"due":"IRB 신청 전","priority":"P2","state":"todo","source":"04 1.1.2, 05 취약대상자"},{"id":"T15","title":"문항 세부 결정","detail":"ATM을 키오스크 사용에 넣을지, RISE 붙임 문항을 넣을지, 7일 GSE 유지, 불안 척도 보기 방향을 정합니다.","owner":"공동","people":["김선휘","이연실","송미령"],"due":"IRB 신청 전","priority":"P2","state":"todo","source":"03 §2.2, §3.4, §3.5, §7.2"}],"design":{"question":"어르신이 키오심 앱으로 14일 동안 집에서 매일 연습하면 키오스크 걱정과 실제 사용이 어떻게 달라지는가? 그리고 이런 연구를 실제로 해낼 수 있는가(모집·유지·참여)?","type":"대조군 없는 한 집단 예비 연구(사전·사후·추적). 앱이 변화의 원인이라고 단정하지 않고 변화의 크기와 실행 가능성을 기술합니다.","participants":"지역사회 어르신. 목표 45명, 모집 범위 30~50명, 최소 등록 40명, 최대 50명. 화성시 서부노인복지관 공고로 모집합니다.","inclusion":"만 60세 또는 65세 이상(미정) · 본인 스마트폰과 인터넷 · 쉬운 설명을 이해하고 스스로 서면 동의 · 0일·14일 방문 가능 · 14일 연습 의향. 키오스크 경험이나 걱정 점수로 빼지 않습니다.","exclusion":"다시 설명하고 도와드린 뒤에도 이해·선택 확인이 어려운 분 · 기기 대여 뒤에도 화면 읽기·조작이 어려운 분 · 장기 부재 · 연구진의 지도학생이나 직접 함께 일하는 사람. 시설 입소·인지 선별 추가 여부는 미정(연구진 결정).","sampleSize":"중간 크기 변화(dz 0.5), 양측 5%, 검정력 80%로 34명, 탈락 20%를 더해 43명 → 목표 45명. 초안 계산이라 제출 전 다시 확인합니다.","procedure":[{"day":"모집 (승인 뒤)","what":"공고 → 문의 → 설명서 미리 드림 → 예약","minutes":"문의 10~15분"},{"day":"0일 (복지관)","what":"설명·서면 동의 → 쉼 → 참여 번호·앱 설치 → 처음 설문(52문항) → 쉼·기기 점검 → 확인 연습 1~2개 → 연습 방법 안내","minutes":"100~140분"},{"day":"1~14일 (집)","what":"짧은 질문 2~3개 → 시나리오 연습 1회 → 미션(버거·카페는 자유 주문도 가능) 1회. 다섯 장소 중 골라서","minutes":"하루 10~20분"},{"day":"7일","what":"중간 설문(33문항) → 그날 연습. 확인 연습은 없음","minutes":"설문 12~16분"},{"day":"14일 (복지관)","what":"그날 연습을 마쳤는지·쉬었는지 확인 → 마지막 설문(52문항) → 쉼 → 0일과 같은 확인 연습","minutes":"45~70분"},{"day":"15일","what":"어제 실제 키오스크를 썼는지 1~2문항","minutes":"1분 이내"},{"day":"42일 (종료 4주 뒤, 추천안)","what":"추적 설문(39문항) → 대여 기기 반납·정리","minutes":"15~18분"},{"day":"정산·종료","what":"사례비 지급 확인 → 자료 정리 → 결과 보고","minutes":"미정"}],"timeNote":"시간은 모두 파일럿 전 어림값입니다. TAS를 빼면 설문은 43·29·43·30문항이 되고, 0일에 디지털 리터러시 설문(22문항)을 선택하면 더 길어집니다.","primaryOutcome":"0일 → 14일 키오스크 불안 점수 변화. 도구는 TAS-K 9문항(허락 받으면) 또는 연구진 키오스크 상황 불안 5문항 총점(5~25점).","fallbackRule":"IRB 최종 제출 때까지 TAS 원저자의 서면 허락이 없으면 TAS-K를 빼고 연구진 5문항 총점을 주 결과로 합니다. 자료를 본 뒤 도구를 고르지 않습니다.","secondary":["실제 키오스크 사용: 사전 지난 2주 대 추적 지난 2주 회상","매일 연습 전 걱정 점수(0~10)와 어제 실제 사용","혼자 사용할 자신감, 일반 자기효능감(GSE)","확인 연습 결과: 목표 달성, 끝까지 했는지, 목표 다시보기 횟수, 걸린 시간, 일부 달성","실제 사용 기회 → 시도 → 혼자 완료/도움 받아 완료/포기 (부록 초안, 기관 검토 뒤 실시 결정)","만족도·사용성, 앞으로 써 볼 생각","모집·등록·14일 유지·추적 유지·연습한 날 수·설문 응답률"],"analysis":"45명 예비 연구라 변화량과 95% 신뢰구간, 분포, 빠진 자료를 중심으로 봅니다. 주 비교는 0→14일 불안 하나입니다. 반복측정 모형 등 세부는 제안 단계이며 분석 담당이 확정합니다. 성공한 사람의 시간만 보지 않고 실패·중단도 함께 보고합니다. 기회가 없었던 것은 실패로 세지 않고, 모름·무응답은 0으로 바꾸지 않습니다.","earlyCheck":"첫 10명이 첫 주에 3일도 못 채우면 실행 가능성을 다시 검토합니다(제안, 미정).","safety":["불편하면 허락을 기다리지 않고 바로 쉬거나 멈춤","7일·14일 불편 질문에 ‘있었다’면 다음 평일 18시까지 연락(제안, 담당 가능 시간 미정)","연구 문의는 응급 창구가 아님. 긴급하면 119·의료기관","연구 관련 손상 보상 규정은 IRB 사무국 확인 필요"],"limits":["대조군이 없어 앱 때문에 좋아졌다고 말할 수 없음","같은 확인 연습을 두 번 하므로 외운 효과가 섞임","실제 사용은 본인 기억에 의존(자기보고)","사례비와 매일 설문 자체가 행동을 바꿀 수 있음","연말연시·설 연휴, 다른 교육의 영향을 가를 수 없음","앱 수행은 실제 키오스크 능력을 직접 잰 것이 아님","45명으로는 하위집단 비교나 척도 구조 확인이 어려움","연구진 문항과 한국어 키오스크판 TAS는 아직 검증 전"]},"measures":[{"name":"키오스크 불안 TAS-K","what":"키오스크에 대한 두려움 6문항과 자신감 3문항. 총점 9~45, 높을수록 불안","when":["0일","7일","14일","추적"],"items":9,"note":"주 결과 후보. 원저자 허락 전이며 한국어판은 초벌. 허락 없으면 뺌"},{"name":"키오스크 상황 불안 (연구진 5문항)","what":"뒷사람 눈치, 시간 압박, 돈이 더 나갈 걱정, 누를 곳, 화면 글자. 총점 5~25","when":["0일","14일","추적","TAS를 뺄 때는 7일도"],"items":5,"note":"TAS 허락이 없으면 주 결과. 검증 전이라 전문가 검토·인지면담 예정"},{"name":"지금 걱정 점수","what":"지금 혼자 키오스크로 주문해야 한다면 얼마나 걱정되는지 0~10","when":["0일","매일 연습 전","7일","14일","추적"],"items":1,"note":"연구진 문항"},{"name":"어제 실제 사용","what":"어제 실제 키오스크를 썼는지, 몇 번인지","when":["1~15일 매일","7일","14일"],"items":2,"note":"응답 없는 날은 0이 아니라 빠진 값"},{"name":"기간 실제 사용","what":"기간 동안 사용 횟수, 장소, 혼자 끝낸 횟수, 도움 받은 횟수, 대신 주문 부탁, 포기, 안 쓴 이유","when":["0일(지난 2주)","7일(1~6일)","14일(7~13일)","추적(지난 2주)"],"items":7,"note":"핵심 비교는 사전 2주 대 추적 2주"},{"name":"실버 기초조사 같은 문항","what":"사용 경험, 혼자 쓸 자신감, 어려울 것 같은 부분, 연습하고 싶은 것","when":["0일","7일(자신감만)","14일","추적"],"items":4,"note":"복지관 사업 문항. 연습하고 싶은 것은 0일만"},{"name":"일반 자기효능감 GSE","what":"일반적인 자신감 10문항, 4단계, 10~40점","when":["0일","7일","14일","추적"],"items":10,"note":"한국어판 원문과 사용 조건 미확인. 7일 유지는 미정"},{"name":"디지털 리터러시 EDLQ","what":"생활 속 디지털 능력 22문항(정보·소통, 콘텐츠, 안전)","when":["0일 첫 연습 전(선택)","14일·추적(선택, 미정)"],"items":22,"note":"원문·채점법·허락 미확보. 약 10분 추가"},{"name":"기본 정보","what":"나이, 성별, 학력, 함께 사는 사람, 일, 눈·귀·손 어려움, 최근 배운 수업","when":["0일"],"items":10,"note":"눈·귀·손 3문항은 별도 선택 동의"},{"name":"스마트폰 사용","what":"사용 기간, 하루 사용 시간, 혼자 할 수 있는 일 등","when":["0일"],"items":6,"note":"연구진 문항"},{"name":"앱 연습 점검","what":"누가 화면을 눌렀는지, 불편했던 일, 다른 수업, 공개 앱 사용, 연습 끝난 뒤 앱 사용(추적만)","when":["7일","14일","추적"],"items":5,"note":"불편 문항은 별도 선택 동의 범위"},{"name":"만족도·사용성","what":"도움이 되었는지, 이해하기 쉬웠는지, 실제와 비슷했는지, 연습량, 어려웠던 점, 앞으로 써 볼 생각","when":["14일","추적(써 볼 생각만)"],"items":11,"note":"선택 자유 의견 1개 별도. 합계 점수는 만들지 않음"},{"name":"추적 자유 의견","what":"연습 뒤 실제 키오스크를 쓰며 달라진 점","when":["추적"],"items":1,"note":"선택"},{"name":"RISE 붙임 문항","what":"스마트폰이나 키오스크를 쓸 때 두렵지 않은지","when":["0일(선택)","추적(선택)"],"items":1,"note":"RISE 보고 맞춤용. 결과로 쓰지 않음, 넣을지 미정"},{"name":"실제 사용 기회·시도 (부록 초안)","what":"지난 2주 키오스크로 할 기회, 직접 시작, 혼자 완료, 도움 받아 완료, 포기, 안 한 이유","when":["0일","추적"],"items":6,"note":"검증 전 초안. 기관 검토·인지면담 뒤 실시 결정. 기존 점수에 더하지 않음"},{"name":"확인 연습 (공통 미션)","what":"앱 미션 1~2개를 같은 도움 방식으로 수행. 목표 달성, 끝까지 했는지, 목표 다시보기, 걸린 시간","when":["0일 첫 연습 전","14일 연습 종료 뒤"],"items":0,"note":"설문이 아님. 사례비와 무관. 첫 시도가 실패·중단이어도 그대로 기록"},{"name":"연구진 기록","what":"참여 번호, 날짜, 읽어 드렸는지, 기기, 0일 기기 점검(글자·버튼·소리), 사람 도움·조건 차이","when":["모든 전체 설문 시점"],"items":0,"note":"참여자에게 묻지 않음"}],"surveyCounts":{"withTAS":{"0일":52,"7일":33,"14일":52,"추적":39},"withoutTAS":{"0일":43,"7일":29,"14일":43,"추적":30},"note":"0일 디지털 리터러시 22문항, RISE 문항, 부록 초안은 따로 셉니다."},"compensation":{"rule":"하루 인정(제안): 그날 짧은 질문 제출(‘답하고 싶지 않아요’도 제출로 인정) + 시나리오 연습 1회 끝까지(완주) + 미션 또는 자유 주문(버거·카페만) 1회 끝까지(완주). 목표를 맞혔는지·속도·걱정 점수·도움 횟수로 금액을 달리하지 않습니다. 완주 2회 기준을 유지할지, 막힘·쉼·안전 중단을 어떻게 인정할지는 미정입니다. 확인 연습은 하루 조건에 들어가지 않습니다.","perPerson":"인정된 날마다 5,000원, 최대 14일 70,000원. 그만두면 그날까지 인정된 날은 지급합니다.","total":"목표 45명이면 3,150,000원, 최대 50명이면 3,500,000원(참여자 사례비만). 인쇄·문자·기기 대여·서버·심의비는 따로 산정해야 합니다.","undecided":["막히거나 쉬거나 안전 때문에 멈춘 날을 똑같이 인정할 방법, 또는 시도·시간 기준으로 바꿀지 (연구진·RISE)","앱 오류로 기   var TABS = [
    { id: "overview", name: "한눈에" },
    { id: "schedule", name: "일정" },
    { id: "roles", name: "역할·할 일" },
    { id: "design", name: "실험 설계" },
    { id: "measures", name: "측정·설문" },
    { id: "pay", name: "사례비·개인정보" },
    { id: "irb", name: "IRB 서류" },
    { id: "app", name: "연구용 앱" },
    { id: "decide", name: "결정할 것" },
    { id: "files", name: "자료 위치" },
    { id: "notes", name: "의견 남기기" }
  ].filter(function (t) { return (t.id !== "files" || arr(D.files).length) && (t.id !== "notes" || D.notesEnabled); });
  /* 공개판(GitHub Pages)은 files를 비워 보낸다. 김선휘 PC의 폴더 경로를 누구나 보는 페이지에 둘 이유가 없다. */

  document.getElementById("title").textContent = D.title || "키오심 연구 계획판";
  document.getElementById("lede").textContent = D.oneLiner || "";
  document.getElementById("updated").textContent = D.updated ? "마지막 갱신 " + fmtDate(D.updated) : "";

  /* ---------- 한눈에 ---------- */
  function overview() {
    var h = "";
    var dz = D.design || {}, cp = D.compensation || {};
    var kp = D.kpis || [
      { n: dz.sampleSizeShort || "45명", l: "목표 인원 (30~50명)" },
      { n: "14일", l: "집에서 매일 연습" },
      { n: "5,000원", l: "하루 사례비 (최대 70,000원)" },
      { n: "5곳", l: "연습 장소" }
    ];
    if (D.notice) h += '<p class="note" style="margin-bottom:16px">' + linkify(D.notice) + "</p>";
    h += '<div class="kpis">' + kp.map(function (k) { return '<div class="kpi"><div class="n">' + esc(k.n) + '</div><div class="l">' + esc(k.l) + "</div></div>"; }).join("") + "</div>";
    if (D.fullTitle) h += '<div class="card" style="margin-bottom:20px"><div class="muted" style="font-size:14px">연구 제목 (가제)</div><div style="font-weight:700;font-size:17px">' + esc(D.fullTitle) + "</div></div>";
    h += "<h2>지금 상태</h2>";
    h += '<div class="grid g2">' + arr(D.status).map(function (s) {
      return '<div class="card status"><div style="flex:1"><div class="lab">' + esc(s.label) + '</div><div class="val">' + linkify(s.value) + "</div></div>" + stBadge(s.state) + "</div>";
    }).join("") + "</div>";
    var up = arr(D.timeline).filter(function (t) { return endKey(t.end || t.date) >= todayKey && t.state !== "done"; })
      .sort(function (a, b) { var x = endKey(a.date), y = endKey(b.date); return x < y ? -1 : x > y ? 1 : 0; }).slice(0, 5);
    if (up.length) {
      h += "<h3>다가오는 일정</h3><div class=\"stack\">" + up.map(function (t) {
        return '<div class="card"><div class="muted" style="font-size:14px">' + fmtDate(t.date) + (t.end ? " ~ " + fmtDate(t.end) : "") + '</div><div style="font-weight:700">' + esc(t.title) + "</div>" + (t.detail ? '<div class="muted" style="font-size:15px">' + linkify(t.detail) + "</div>" : "") + "<div>" + whoTags(t.who) + "</div></div>";
      }).join("") + "</div>";
    }
    var p0 = arr(D.tasks).filter(function (t) { return t.priority === "P0" && t.state !== "done"; }).slice(0, 8);
    if (p0.length) {
      h += '<h3>가장 먼저 할 일</h3><div class="stack">' + p0.map(taskCard).join("") + "</div>";
      h += '<p style="margin-top:10px"><a href="#roles" data-go="roles">할 일 전체 보기</a></p>';
    }
    return h;
  }

  /* ---------- 일정 ---------- */
  function schedule() {
    /* 달만 적힌 일정은 그달 가운데(15일)로 놓고 줄 세운다. 1일로 놓으면 10월 할 일들이 이미 끝난 10월 5일보다 앞에 섰다. */
    function sortKey(s) { var m = /^(\d{4})-(\d{2})(-(\d{2}))?/.exec(String(s || "")); return m ? m[1] + m[2] + (m[4] || "15") : "99999999"; }
    var items = arr(D.timeline).slice().sort(function (a, b) { var x = sortKey(a.date), y = sortKey(b.date); return x < y ? -1 : x > y ? 1 : 0; });
    var h = "<h2>전체 일정</h2><p class=\"sub\">날짜 옆 ‘예정’은 아직 확정되지 않은 날짜입니다. IRB 승인 전에는 모집과 자료 수집을 하지 않습니다.</p><ol class=\"timeline\">";
    var placed = false;
    items.forEach(function (t) {
      /* 오늘 표시는 "아직 끝나지 않은 첫 일정" 앞에 둔다. 날짜로만 고르면 달만 적힌 10월 일들이 오늘보다 앞(지난 일)처럼 보인다. */
      if (!placed && t.state !== "done" && endKey(t.end || t.date) >= todayKey) { h += '<li class="todayline">오늘 ' + fmtDate(todayKey.slice(0, 4) + "-" + todayKey.slice(4, 6) + "-" + todayKey.slice(6)) + "</li>"; placed = true; }
      var st = STATE[t.state] ? t.state : "todo";
      h += '<li class="tl ' + st + '"><div class="when">' + fmtDate(t.date) + (t.end ? " ~ " + fmtDate(t.end) : "") + " " + stBadge(st) + '</div><div class="what">' + esc(t.title) + "</div>" + (t.detail ? '<div class="det">' + linkify(t.detail) + "</div>" : "") + "<div>" + whoTags(t.who) + "</div></li>";
    });
    if (!placed) h += '<li class="todayline">오늘</li>';
    return h + "</ol>";
  }

  /* ---------- 역할·할 일 ---------- */
  function taskCard(t) {
    return '<div class="card task"><div class="row1"><span class="t">' + esc(t.title) + "</span>" + priBadge(t.priority) + stBadge(t.state) + "</div>" +
      (t.detail ? '<div class="d">' + linkify(t.detail) + "</div>" : "") +
      '<div class="meta"><span>주 담당 <b>' + esc(txt(t.owner)) + "</b></span>" + (arr(t.people).filter(function (p) { return p !== t.owner; }).length ? "<span>함께 " + esc(arr(t.people).filter(function (p) { return p !== t.owner; }).join(", ")) + "</span>" : "") + (t.due ? "<span>기한 " + (/^\d{4}-\d{2}/.test(t.due) ? fmtDate(t.due) : esc(t.due)) + "</span>" : "") + (t.source ? "<span>근거 " + esc(t.source) + "</span>" : "") + "</div></div>";
  }
  var filt = { owner: "전체", state: "남은 일" };
  function owners() {
    var set = [];
    arr(D.tasks).forEach(function (t) { arr(t.owner).concat(arr(t.people)).forEach(function (o) { String(o).split(/[·,\/]\s*/).forEach(function (p) { p = p.trim(); if (p && set.indexOf(p) < 0) set.push(p); }); }); });
    var order = ["김선휘", "이연실", "송미령", "공동"];
    set.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "ko"); });
    return ["전체"].concat(set);
  }
  function rolesTasks() {
    var h = "<h2>누가 무엇을 맡나</h2><div class=\"grid g3\">" + arr(D.roles).map(function (r) {
      return '<div class="card"><div style="font-weight:700;font-size:17px">' + esc(r.person) + '</div><div class="muted" style="font-size:14px;margin-bottom:6px">' + esc(r.role) + "</div>" + list(r.responsibilities) + "</div>";
    }).join("") + "</div>";
    h += '<h3 id="tasks-h">할 일</h3><div class="chips" role="group" aria-label="담당자로 보기" id="ownerChips">' + owners().map(function (o) { return '<button class="chip" data-owner="' + esc(o) + '" aria-pressed="' + (filt.owner === o) + '">' + esc(o) + "</button>"; }).join("") + "</div>";
    h += '<div class="chips" role="group" aria-label="상태로 보기" id="stateChips">' + ["남은 일", "전체", "완료"].map(function (s) { return '<button class="chip" data-state="' + s + '" aria-pressed="' + (filt.state === s) + '">' + s + "</button>"; }).join("") + "</div>";
    h += '<div id="taskList"></div>';
    return h;
  }
  function drawTasks() {
    var box = document.getElementById("taskList"); if (!box) return;
    var po = { P0: 0, P1: 1, P2: 2 };
    var xs = arr(D.tasks).filter(function (t) {
      var okO = filt.owner === "전체" || String(txt(t.owner)).indexOf(filt.owner) >= 0 || arr(t.people).indexOf(filt.owner) >= 0;
      var okS = filt.state === "전체" || (filt.state === "완료" ? t.state === "done" : t.state !== "done");
      return okO && okS;
    }).sort(function (a, b) { return ((po[a.priority] == null ? 3 : po[a.priority]) - (po[b.priority] == null ? 3 : po[b.priority])) || (dateKey(a.due) < dateKey(b.due) ? -1 : 1); });
    box.innerHTML = '<p class="count">' + xs.length + "건</p>" + (xs.length ? '<div class="stack">' + xs.map(taskCard).join("") + "</div>" : '<p class="muted">해당하는 할 일이 없습니다.</p>');
  }

  /* ---------- 실험 설계 ---------- */
  function design() {
    var d = D.design || {};
    var h = "<h2>실험 설계</h2>";
    h += '<div class="card"><dl class="kv">' +
      kv("연구 질문", d.question) + kv("연구 형태", d.type) + kv("참여자", d.participants) + kv("인원", d.sampleSize) +

      kv("주 결과", d.primaryOutcome) + kv("대체 규칙", d.fallbackRule) + kv("보조 결과", list(d.secondary), true) + kv("분석", d.analysis) +
      "</dl></div>";
    if (arr(d.procedure).length) {
      h += '<h3>참여자가 겪는 순서</h3><div class="tablewrap"><table><thead><tr><th>언제</th><th>무엇을</th><th>걸리는 시간</th></tr></thead><tbody>' +
        arr(d.procedure).map(function (p) { return "<tr><td><b>" + esc(p.day) + "</b></td><td>" + linkify(txt(p.what)) + '</td><td class="num">' + esc(p.minutes) + "</td></tr>"; }).join("") + "</tbody></table></div>";
      if (d.timeNote) h += '<p class="muted" style="font-size:14px;margin-top:8px">' + linkify(d.timeNote) + "</p>";
    }
    if (d.earlyCheck || arr(d.safety).length) {

  }
  function kv(k, v, raw) { if (v == null || v === "" || (Array.isArray(v) && !v.length)) return ""; return "<dt>" + esc(k) + "</dt><dd>" + (raw ? v : linkify(txt(v))) + "</dd>"; }

  /* ---------- 측정·설문 ---------- */
  function measures() {
    var h = "<h2>측정 도구와 설문</h2><p class=\"sub\">무엇을, 언제, 몇 문항으로 재는지</p>";

        (sc.withoutTAS ? '<tr><td>TAS 뺄 때</td>' + cols.map(function (c) { return '<td class="num">' + esc(sc.withoutTAS[c]) + "</td>"; }).join("") + "</tr>" : "") + "</tbody></table></div>";

    h += '<div class="grid g2">' + arr(D.measures).map(function (m) {
      return '<div class="card"><div style="font-weight:700;font-size:17px">' + esc(m.name) + '</div><p style="margin:4px 0 8px;color:var(--ink-2)">' + linkify(txt(m.what)) + '</p><dl class="kv">' + kv("시점", txt(m.when)) + (m.items ? kv("문항 수", m.items + "문항") : "") + kv("참고", m.note) + "</dl></div>";
    }).join("") + "</div>";

  /* ---------- 사례비·개인정보 ---------- */
  function pay() {
    var c = D.compensation || {};
    var h = "<h2>사례비</h2><div class=\"card\"><dl class=\"kv\">" + kv("지급 규칙", c.rule) + kv("1인 최대", c.perPerson) + kv("전체 예산", c.total) + kv("정해지지 않은 것", list(c.undecided), true) + "</dl></div>";

    if (arr(D.dataHandling).length) {
      h += '<div class="tablewrap"><table><thead><tr><th>항목</th><th>계획</th><th>정할 것</th></tr></thead><tbody>' + arr(D.dataHandling).map(function (x) {
        return "<tr><td><b>" + esc(x.topic) + "</b></td><td>" + linkify(txt(x.plan)) + "</td><td>" + (x.undecided ? linkify(txt(x.undecided)) : '<span class="muted">-</span>') + "</td></tr>";
      }).join("") + "</tbody></table></div>";

  /* ---------- IRB 서류 ---------- */
  function irb() {
    return "<h2>IRB 서류</h2><p class=\"sub\">각 서류의 쓰임과 남은 일. 한글(HWP) 양식은 아직 예전 내용이라 최신 초안으로 다시 채워야 합니다.</p><div class=\"stack\">" + arr(D.irbDocs).map(function (x) {
      return '<div class="card"><div class="row1" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-weight:700;font-size:17px;flex:1 1 220px">' + esc(x.name) + "</span>" + (x.state ? '<span class="badge s-todo">' + esc(x.state) + "</span>" : "") + "</div>" +
        (x.purpose ? '<p style="margin:6px 0;color:var(--ink-2)">' + linkify(txt(x.purpose)) + "</p>" : "") +

    }).join("") + "</div>";
  }

    if (arr(a.researchMode).length) h += "<h3>연구용 화면에서 달라지는 점</h3><div class=\"card\">" + list(a.researchMode) + "</div>";

  /* ---------- 의견 남기기 ----------
     공동연구원 두 분은 Claude·GitHub 계정이 없다. 그래서 로그인 없이 이름과 의견만 받아 Firestore(서울)에 쌓는다.

     반영 여부는 이 데이터가 아니라 페이지 내용(D.noteStatus)에 둔다 — 익명 쓰기에 수정 권한을 열지 않으려고. */
  var FS = "https://firestore.googleapis.com/v1/projects/kiosim-feedback-2026/databases/(default)/documents";
  var lastTab = "overview";
  function tabName(id) { var t = TABS.filter(function (x) { return x.id === id; })[0]; return t ? t.name : "전체"; }
  function notesPanel() {
    var opts = ["전체"].concat(TABS.filter(function (t) { return t.id !== "notes"; }).map(function (t) { return t.name; }));
    var pre = lastTab && lastTab !== "notes" ? tabName(lastTab) : "전체";
    var savedName = ""; try { savedName = localStorage.getItem("kiosim-study-name") || ""; } catch (e) {}
    return "<h2>의견 남기기</h2>" +
      '<p class="sub">로그인 없이 이름과 의견만 적으시면 됩니다. 연구책임자가 읽고 계획판과 서류에 반영합니다.</p>' +
      '<div class="card"><form class="noteform" id="noteForm" novalidate>' +
      '<div class="row2"><label>이름<input id="nName" maxlength="30" autocomplete="name" value="' + esc(savedName) + '" placeholder="예: 이연실"></label>' +
      '<label>어느 부분<select id="nTab">' + opts.map(function (o) { return "<option" + (o === pre ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select></label></div>" +
      '<label>의견<textarea id="nText" maxlength="3000" placeholder="고칠 점, 질문, 결정 의견을 자유롭게 적어 주세요."></textarea></label>' +
      '<p class="muted" style="font-size:14px;margin:0">남긴 의견은 이 페이지를 여는 사람이면 누구나 볼 수 있습니다. 참여자 이름·연락처 같은 개인정보는 적지 말아 주세요. 남긴 뒤에는 고치거나 지울 수 없으니, 바꿀 내용은 새 의견으로 남겨 주세요.</p>' +
      '<button type="submit" id="nSubmit">남기기</button><p class="formmsg" id="nMsg" role="status"></p></form></div>' +
      '<h3>남겨진 의견</h3><div id="noteList" class="stack"><p class="muted">불러오는 중…</p></div>';
  }
  function fmtTime(ts) {
    try { return new Date(ts).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ts || ""; }
  }
  function loadNotes() {
    var box = document.getElementById("noteList"); if (!box) return;
    var all = [];
    function page(token) {
      return fetch(FS + "/studyNotes?pageSize=300" + (token ? "&pageToken=" + encodeURIComponent(token) : "")).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      }).then(function (j) {
        (j.documents || []).forEach(function (d) {
          var f = d.fields || {};
          all.push({ id: d.name.split("/").pop(), name: (f.name || {}).stringValue || "", text: (f.text || {}).stringValue || "", tab: (f.tab || {}).stringValue || "", at: (f.createdAt || {}).timestampValue || d.createTime });
        });
        return j.nextPageToken ? page(j.nextPageToken) : null;
      });
    }
    page(null).then(function () {
      all.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
      var st = D.noteStatus || {};
      box.innerHTML = all.length ? all.map(function (n) {
        var s = st[n.id];
        return '<div class="card note"><div class="head"><b>' + esc(n.name) + "</b><span>" + esc(fmtTime(n.at)) + "</span>" + (n.tab ? '<span class="who">' + esc(n.tab) + "</span>" : "") +
          (s ? '<span class="badge s-' + (s.state === "반영함" ? "done" : "doing") + '">' + esc(s.state) + "</span>" : "") + "</div>" +
          '<div class="body">' + esc(n.text) + "</div>" + (s && s.note ? '<div class="reply">' + linkify(s.note) + "</div>" : "") + "</div>";
      }).join("") : '<p class="muted">아직 남겨진 의견이 없습니다.</p>';
    }).catch(function () {
      box.innerHTML = '<p class="muted">의견 목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>';
    });
  }
  function submitNote(e) {
    e.preventDefault();
    var name = document.getElementById("nName").value.trim();
    var text = document.getElementById("nText").value.trim();
    var tab = document.getElementById("nTab").value;
    var msg = document.getElementById("nMsg"), btn = document.getElementById("nSubmit");
    msg.className = "formmsg";
    if (!name) { msg.className = "formmsg bad"; msg.textContent = "이름을 적어 주세요."; document.getElementById("nName").focus(); return; }
    if (!text) { msg.className = "formmsg bad"; msg.textContent = "의견을 적어 주세요."; document.getElementById("nText").focus(); return; }
    btn.disabled = true; msg.textContent = "보내는 중…";
    var id = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var body = { writes: [{
      update: { name: "projects/kiosim-feedback-2026/databases/(default)/documents/studyNotes/" + id,
        fields: { name: { stringValue: name.slice(0, 30) }, text: { stringValue: text.slice(0, 3000) }, tab: { stringValue: tab.slice(0, 40) } } },
      updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
      currentDocument: { exists: false }
    }] };
    fetch(FS + ":commit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      try { localStorage.setItem("kiosim-study-name", name); } catch (e2) {}
      document.getElementById("nText").value = "";
      msg.className = "formmsg ok"; msg.textContent = "남겼습니다. 고맙습니다.";
      loadNotes();
    }).catch(function () {
      msg.className = "formmsg bad"; msg.textContent = "보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. 적으신 내용은 그대로 있습니다.";
    }).then(function () { btn.disabled = false; });
  }

  var RENDER = { overview: overview, schedule: schedule, roles: rolesTasks, design: design, measures: measures, pay: pay, irb: irb, app: app, decide: decide, files: files, notes: notesPanel };
  var main = document.getElementById("main"), row = document.getElementById("tabrow");
  row.innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" id="tab-' + t.id + '" aria-controls="panel-' + t.id + '" data-tab="' + t.id + '">' + t.name + "</button>"; }).join("");
  main.innerHTML = TABS.map(function (t) { return '<section class="panel" role="tabpanel" id="panel-' + t.id + '" aria-labelledby="tab-' + t.id + '"></section>'; }).join("");
  var drawn = {};
  function show(id, push) {
    if (!RENDER[id]) id = "overview";
    TABS.forEach(function (t) {
      var on = t.id === id;
      var b = document.getElementById("tab-" + t.id); b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + t.id).classList.toggle("on", on);
    });
    /* 의견 탭은 열 때마다 새로 그린다: "어느 부분"을 방금 보던 탭으로 맞추고 목록도 새로 받는다. */
    if (id === "notes") { document.getElementById("panel-notes").innerHTML = notesPanel(); document.getElementById("noteForm").addEventListener("submit", submitNote); loadNotes(); }
    else if (!drawn[id]) { document.getElementById("panel-" + id).innerHTML = RENDER[id](); drawn[id] = true; if (id === "roles") drawTasks(); }
    if (id !== "notes") lastTab = id;
    var b = document.getElementById("tab-" + id); if (b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; } }
    try { localStorage.setItem("kiosim-study-tab", id); } catch (e) {}
  }
  row.addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) { show(b.dataset.tab, true); window.scrollTo({ top: 0 }); } });
  row.addEventListener("keydown", function (e) {
    var i = TABS.findIndex(function (t) { return document.getElementById("tab-" + t.id).getAttribute("aria-selected") === "true"; });
    var n = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : e.key === "Home" ? 0 : e.key === "End" ? TABS.length - 1 : null;
    if (n == null) return; e.preventDefault(); n = (n + TABS.length) % TABS.length; show(TABS[n].id, true); document.getElementById("tab-" + TABS[n].id).focus();
  });
  main.addEventListener("click", function (e) {
    var g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); show(g.dataset.go, true); window.scrollTo({ top: 0 }); return; }
    var o = e.target.closest("[data-owner]"); if (o) { filt.owner = o.dataset.owner; document.querySelectorAll("#ownerChips .chip").forEach(function (c) { c.setAttribute("aria-pressed", c === o); }); drawTasks(); return; }
    var s = e.target.closest("[data-state]"); if (s) { filt.state = s.dataset.state; document.querySelectorAll("#stateChips .chip").forEach(function (c) { c.setAttribute("aria-pressed", c === s); }); drawTasks(); return; }
    var c = e.target.closest("[data-copy]"); if (c) {
      var t = document.getElementById(c.dataset.copy).textContent;
      var done = function () { c.textContent = "복사됨"; setTimeout(function () { c.textContent = "경로 복사"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { c.textContent = "복사 안 됨"; }); else c.textContent = "복사 안 됨";
    }
  });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1), false); });
  if (D.notesEnabled) {
    var nj = document.getElementById("noteJump"); nj.hidden = false;
    nj.addEventListener("click", function () { show("notes", true); window.scrollTo({ top: 0 }); var t = document.getElementById("nText"); if (t) t.focus(); });
  }
  var start = location.hash.slice(1);
  if (!RENDER[start]) { try { start = localStorage.getItem("kiosim-study-tab") || "overview"; } catch (e) { start = "overview"; } }
  show(start, false);
  document.getElementById("foot").innerHTML = "이 페이지는 연구진 내부 공유용입니다. 참여자 개인정보는 담지 않습니다. 내용은 초안이며 IRB 승인 전입니다." + (D.updated ? " · 갱신 " + esc(D.updated) : "");
})();
</script>
</body>
</html>
